<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Hen Catch</title>
    <link rel="icon" type="image/png" href="../assets/ui/icon.jpg">
    <link rel='stylesheet' href='henstyle.css'>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>

<body>

    <div class="game-container">

        <div class="game">
            <button id="muteBtn"><img src="../assets/ui/mute.png" alt="Mute"></button>
            <div id="startScreen">
                <h1> <img src="../assets/ui/Egg Catch Wooden Game Banner.png" alt="Hen Catch"> </h1>
                <div>
                <button id="easyBtn"><img src="../assets/ui/easy.png"></button>
                <button id="hardBtn"><img src="../assets/ui/hard.png"></button>
                </div>
                <button id="startBtn"><img src="../assets/ui/play_button.png"></button>
            </div>
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen1">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen2">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen3">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen4">

            <img id="basket" src="../assets/basket/basket_idle.png" class="Basket">
            <div id="scoreBoard">
                <div id="eggCounter">🥚 Eggs: 0</div>
                <div id="eggLives">❤️ Lives: 3</div>
            </div>
            <button id="Pause"><img src="../assets/ui/pause_button.png" alt="Pause"></button>
            <div id="gameOverPopup">
                <h1><img src="../assets/ui/game_over.png" alt="Game Over"></h1>
                <div id="finalScoreBoard">
                    <p id="finalScore">Eggs Caught: 0</p>
                </div>
                <button id="restartBtn"><img src="../assets/ui/restart_button.png"></button>
            </div>

        </div>


    </div>

    <script src="henscript.js"></script>
</body>

</html>
