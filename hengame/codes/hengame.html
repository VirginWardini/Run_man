<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Hen Catch</title>
    <link rel="icon" type="image/png" href="ui/icon.png">
    <link rel='stylesheet' href='henstyle.css'>
</head>
<body>
    
    <div class="game-container">
        
        <div class="game">
            <div id="startScreen">
                <h1>🐔 HEN CATCH 🥚</h1>
                <button id="startBtn">▶ START GAME</button>
            </div>
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen1">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen2">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen3">
            <img src="../assets/hen_idle/hen_idle_1.png" class="hen" id="hen4">

            <img id="basket" src="../assets/basket/basket_idle.png" class="Basket">
            <div id="eggCounter">🥚 Eggs: 0</div>
            <div id="eggLives">❤️ Lives: 3</div>
            <button id="Pause">Pause Game</button>
            <div id="gameOverPopup">
                <h1>GAME OVER! 💔</h1>
                <p id="finalScore">Eggs caught: 0</p>
                <button id="restartBtn">Play Again 🔄</button>
            </div>

        </div>

    
    </div>

    <script src="henscript.js"></script>
</body>
</html>
